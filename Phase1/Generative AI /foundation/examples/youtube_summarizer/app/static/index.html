<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex;
    justify-content: center; padding: 40px 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 20px; color: #58a6ff; }
  .input-row { display: flex; gap: 8px; margin-bottom: 24px; }
  input {
    flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #30363d;
    background: #161b22; color: #e6edf3; font-size: 15px; outline: none;
  }
  input:focus { border-color: #58a6ff; }
  button {
    padding: 12px 24px; border-radius: 8px; border: none;
    background: #238636; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #2ea043; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #output {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; min-height: 200px; font-size: 15px; line-height: 1.7;
    white-space: pre-wrap; word-wrap: break-word;
  }
  #output:empty::before {
    content: "Response will appear here..."; color: #484f58;
  }
  .cursor {
    display: inline-block; width: 2px; height: 1em; background: #58a6ff;
    margin-left: 2px; vertical-align: text-bottom; animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .error { color: #f85149; }
</style>
</head>
<body>
<div class="container">
  <h1>LLM Streaming Demo</h1>
  <div class="input-row">
    <input id="prompt" type="text" placeholder="Enter your prompt..." autofocus />
    <button id="btn" onclick="generate()">Generate</button>
  </div>
  <div id="output"></div>
</div>
<script>
async function generate() {
  const prompt = document.getElementById('prompt').value;
  if (!prompt) return;
  
  const output = document.getElementById('output');
  const btn = document.getElementById('btn');
  
  output.textContent = '';
  output.classList.remove('error');
  btn.disabled = true;
  btn.textContent = 'Streaming...';
  
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  output.appendChild(cursor);
  
  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    
    if (!response.ok) {
      output.textContent = `Error: ${response.status} ${response.statusText}`;
      output.classList.add('error');
      cursor.remove();
      btn.disabled = false;
      btn.textContent = 'Generate';
      return;
    }
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value, { stream: true });
      
      // Split by SSE newline structure to handle grouped chunks
      const lines = chunk.split('\n');
      
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          // Slice off the 'data: ' prefix
          const textToken = line.slice(6); 
          if (textToken) {
            output.insertBefore(document.createTextNode(textToken), cursor);
          }
        }
      }
    }
  } catch (err) {
    output.textContent = `Error: ${err.message}`;
    output.classList.add('error');
  } finally {
    cursor.remove();
    btn.disabled = false;
    btn.textContent = 'Generate';
  }
}

document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
