<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111318; color: #c9d1d3; min-height: 100vh; display: flex;
    justify-content: center; padding: 48px 20px;
  }
  .container { max-width: 720px; width: 100%; }
  h1 {
    font-size: 20px; font-weight: 600; margin-bottom: 24px;
    color: #e4e7ea; letter-spacing: -0.01em;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 24px; }
  input {
    flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #2c2f33;
    background: #191b1f; color: #c9d1d3; font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #5b6e8a; }
  input::placeholder { color: #5a5e64; }
  button {
    padding: 10px 20px; border-radius: 6px; border: none;
    background: #2c2f33; color: #c9d1d3; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: background 0.15s;
  }
  button:hover { background: #3a3d42; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #output {
    background: #191b1f; border: 1px solid #2c2f33; border-radius: 8px;
    padding: 20px 24px; min-height: 180px; font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-wrap: break-word;
  }
  #output:empty::before {
    content: "Response will appear here..."; color: #484c52;
  }
  .cursor {
    display: inline-block; width: 2px; height: 1em; background: #8599b3;
    margin-left: 2px; vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .error { color: #b85c5c; }

  .tool-call {
    margin: 12px 0; padding: 10px 14px; border-radius: 6px;
    border-left: 3px solid #5b6e8a; background: #1e2126;
    font-size: 13px;
  }
  .tool-call .name { font-weight: 600; color: #a0b3cc; }
  .tool-call .args {
    margin-top: 4px; font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px; color: #7a8088;
  }
  .tool-result {
    margin: 0 0 12px 17px; padding: 6px 14px; font-size: 13px;
    border-left: 3px solid #3d4f5c; color: #8a9ba8;
  }
  .tool-result .result-text { color: #95a7b5; }

  .tool-loader {
    margin: 8px 0 12px 17px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #7a8088;
  }
  .spinner {
    width: 14px; height: 14px; border: 2px solid #2c2f33;
    border-top-color: #8599b3; border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>LLM Streaming Demo</h1>
  <div class="input-row">
    <input id="prompt" type="text" placeholder="Enter your prompt..." autofocus />
    <button id="btn" onclick="generate()">Generate</button>
  </div>
  <div id="output"></div>
</div>
<script>

let activeLoaders = {};

function showToolStart(tool, cursor) {
  const div = document.createElement("div");
  div.className = "tool-call";
  div.innerHTML = `<span class="name">${tool.name}</span><div class="args">${JSON.stringify(tool.args, null, 2)}</div>`;
  output.insertBefore(div, cursor);

  const loader = document.createElement("div");
  loader.className = "tool-loader";
  loader.id = "loader-" + tool.name;
  loader.innerHTML = `<div class="spinner"></div><span>Running ${tool.name}...</span>`;
  output.insertBefore(loader, cursor);

  activeLoaders[tool.name] = loader;
}

function showToolEnd(tool, cursor) {
  const loader = activeLoaders[tool.name];
  if (loader) {
    loader.remove();
    delete activeLoaders[tool.name];
  }

  const div = document.createElement("div");
  div.className = "tool-result";
  div.innerHTML = `<span class="result-text">${tool.result || "Done"}</span>`;
  output.insertBefore(div, cursor);
}

async function generate() {
  const prompt = document.getElementById('prompt').value;
  if (!prompt) return;

  const output = document.getElementById('output');
  const btn = document.getElementById('btn');

  output.textContent = '';
  output.classList.remove('error');
  btn.disabled = true;
  btn.textContent = 'Streaming...';
  activeLoaders = {};

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  output.appendChild(cursor);

  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    if (!response.ok) {
      output.textContent = `Error: ${response.status} ${response.statusText}`;
      output.classList.add('error');
      cursor.remove();
      btn.disabled = false;
      btn.textContent = 'Generate';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const events = chunk.trim().split("\n\n");

      for (const eventText of events) {
        let event = "message";
        let data = "";

        for (const line of eventText.split("\n")) {
          if (line.startsWith("event:")) {
            event = line.slice(6).trim();
          }
          if (line.startsWith("data:")) {
            data = JSON.parse(line.slice(5).trim());
          }
        }

        switch (event) {
          case "token":
            output.insertBefore(document.createTextNode(data), cursor);
            break;
          case "tool_start":
            showToolStart(data, cursor);
            break;
          case "tool_end":
            showToolEnd(data, cursor);
            break;
        }
      }
    }
  } catch (err) {
    output.textContent = `Error: ${err.message}`;
    output.classList.add('error');
  } finally {
    cursor.remove();
    btn.disabled = false;
    btn.textContent = 'Generate';
  }
}

document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
